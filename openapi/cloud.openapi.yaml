components:
  schemas:
    AcceptedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AcceptedOutputBody.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          description: When a code sent now stops being accepted. Present whether or not one was actually sent, so the answer cannot be used to tell which addresses have accounts.
          format: date-time
          type: string
        message:
          description: Human-readable confirmation that the request was accepted.
          type: string
      required:
        - message
        - expires_at
      type: object
    BackupBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BackupBody.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the snapshot was uploaded.
          format: date-time
          type: string
        device_id:
          description: The device that uploaded it.
          format: uuid
          type: string
        device_label:
          description: That device's name, so a list can say where a snapshot came from.
          type: string
        format_version:
          description: The node's snapshot format version. The cloud stores it without interpreting it.
          format: int64
          type: integer
        id:
          description: Stable snapshot identifier.
          format: uuid
          type: string
        sha256:
          description: Hex SHA-256 of the body.
          type: string
        size_bytes:
          description: Size of the stored body, compressed as the node sent it.
          format: int64
          type: integer
      required:
        - id
        - device_id
        - device_label
        - created_at
        - size_bytes
        - sha256
        - format_version
      type: object
    BackupListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BackupListOutputBody.json
          format: uri
          readOnly: true
          type: string
        backups:
          description: The account's snapshots, newest first.
          items:
            $ref: "#/components/schemas/BackupBody"
          type:
            - array
            - "null"
      required:
        - backups
      type: object
    Body:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Body.json
          format: uri
          readOnly: true
          type: string
        created_at:
          description: When the account was created.
          format: date-time
          type: string
        display_name:
          description: Name shown to other users.
          type: string
        email:
          description: The account's normalised address.
          format: email
          type: string
        email_verified:
          description: Whether the address has been confirmed.
          type: boolean
        id:
          description: Stable account identifier.
          format: uuid
          type: string
        role:
          description: Permission level.
          enum:
            - user
            - admin
          type: string
      required:
        - id
        - email
        - display_name
        - role
        - email_verified
        - created_at
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ChangePasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        current_password:
          description: The password in use now. Required even though the session proves identity.
          maxLength: 128
          type: string
        new_password:
          description: The replacement. Same rules as registration.
          maxLength: 128
          minLength: 10
          type: string
      required:
        - current_password
        - new_password
      type: object
    ClientRequirements:
      additionalProperties: false
      properties:
        min_supported:
          description: Oldest client build allowed to use cloud features. Empty means no minimum is enforced.
          examples:
            - 1.2.0
          type: string
        recommended:
          description: Newest available build, for a non-blocking update hint. Empty means no hint.
          examples:
            - 1.4.0
          type: string
        update_url:
          description: Where to send the user to update. Always present when min_supported is set.
          examples:
            - https://mediary.example/download
          type: string
      type: object
    CompletePasswordResetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CompletePasswordResetInputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          description: The 6-digit code from the reset email.
          pattern: ^[0-9]{6}$
          type: string
        email:
          description: The address the code was sent to.
          format: email
          maxLength: 254
          type: string
        password:
          description: The new password. Same rules as registration.
          maxLength: 128
          minLength: 10
          type: string
      required:
        - email
        - code
        - password
      type: object
    ConfirmEmailInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ConfirmEmailInputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          description: The 6-digit code from the confirmation email.
          pattern: ^[0-9]{6}$
          type: string
      required:
        - code
      type: object
    DeleteAccountInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeleteAccountInputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          description: The 6-digit code from the account deletion email.
          pattern: ^[0-9]{6}$
          type: string
      required:
        - code
      type: object
    DeviceBody:
      additionalProperties: false
      properties:
        created_at:
          description: When the device was paired.
          format: date-time
          type: string
        expires_at:
          description: When the token stops working and the node has to be paired again.
          format: date-time
          type: string
        id:
          description: Stable device identifier.
          format: uuid
          type: string
        label:
          description: Name the node gave itself when paired, usually its hostname.
          type: string
        last_seen_at:
          description: Last time the device used its token, to about a minute.
          format: date-time
          type: string
      required:
        - id
        - label
        - created_at
        - last_seen_at
        - expires_at
      type: object
    DeviceListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeviceListOutputBody.json
          format: uri
          readOnly: true
          type: string
        devices:
          description: Live devices, oldest first. Revoked ones are not listed.
          items:
            $ref: "#/components/schemas/DeviceBody"
          type:
            - array
            - "null"
      required:
        - devices
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExchangeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ExchangeInputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          description: The pairing code shown in the desktop app.
          maxLength: 16
          minLength: 8
          type: string
        label:
          description: How the node names itself in the device list, usually its hostname.
          maxLength: 64
          minLength: 1
          type: string
      required:
        - code
        - label
      type: object
    ExchangeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ExchangeOutputBody.json
          format: uri
          readOnly: true
          type: string
        device:
          $ref: "#/components/schemas/DeviceBody"
          description: The new device.
        device_token:
          description: "Send as X-Mediary-Device-Token. Shown once and never again: only its hash is stored."
          type: string
      required:
        - device
        - device_token
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        built:
          description: Build timestamp.
          examples:
            - "2026-08-27T12:00:00Z"
          type: string
        client:
          $ref: "#/components/schemas/ClientRequirements"
          description: Which client builds this deployment serves.
        commit:
          description: Git commit the build came from.
          examples:
            - abc1234
          type: string
        status:
          description: Service status.
          examples:
            - ok
          type: string
        version:
          description: Semantic version of the running build.
          examples:
            - 0.1.0
          type: string
      required:
        - status
        - version
        - commit
        - built
        - client
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: The account's address.
          format: email
          maxLength: 254
          type: string
        password:
          description: The account's password.
          maxLength: 128
          type: string
      required:
        - email
        - password
      type: object
    OAuthCallbackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OAuthCallbackInputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Authorization code from the provider's redirect.
          type: string
        state:
          description: The state value returned alongside the code.
          type: string
      required:
        - code
        - state
      type: object
    OAuthProvidersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OAuthProvidersOutputBody.json
          format: uri
          readOnly: true
          type: string
        providers:
          description: OAuth providers available on this deployment, e.g. ["google"].
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - providers
      type: object
    OAuthStartInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OAuthStartInputBody.json
          format: uri
          readOnly: true
          type: string
        callback_port:
          description: Loopback port the native client is listening on. The redirect is then aimed at http://127.0.0.1:<port>/oauth/callback. Omit it on deployments that use the provider's registered redirect URL instead.
          format: int64
          maximum: 65535
          minimum: 1024
          type: integer
      type: object
    OAuthStartOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OAuthStartOutputBody.json
          format: uri
          readOnly: true
          type: string
        url:
          description: Open this in a browser to begin the provider's consent flow.
          type: string
      required:
        - url
      type: object
    PairingCodeOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PairingCodeOutputBody.json
          format: uri
          readOnly: true
          type: string
        code:
          description: One-time code for the node to exchange. Case and the dash do not matter.
          examples:
            - K7QM-4XPA
          type: string
        expires_at:
          description: After this the code is refused.
          format: date-time
          type: string
      required:
        - code
        - expires_at
      type: object
    QuotaBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/QuotaBody.json
          format: uri
          readOnly: true
          type: string
        enabled:
          description: Whether this deployment offers AI at all.
          type: boolean
        limit:
          description: Requests the account may make per day (UTC).
          format: int64
          type: integer
        remaining:
          description: Requests left today.
          format: int64
          type: integer
        resets_at:
          description: "When the count starts over: the next midnight UTC."
          format: date-time
          type: string
        used:
          description: Requests made today. Failed ones are not counted.
          format: int64
          type: integer
      required:
        - enabled
        - limit
        - used
        - remaining
        - resets_at
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RegisterInputBody.json
          format: uri
          readOnly: true
          type: string
        display_name:
          description: Name shown to other users. Must be unique, ignoring case.
          maxLength: 40
          minLength: 2
          type: string
        email:
          description: Address to register. Stored lowercased.
          format: email
          maxLength: 254
          type: string
        password:
          description: At least 10 characters. No composition rules — length is what makes a password hard to guess.
          maxLength: 128
          minLength: 10
          type: string
      required:
        - email
        - password
        - display_name
      type: object
    RequestPasswordResetInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RequestPasswordResetInputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          description: Address to send a reset code to.
          format: email
          maxLength: 254
          type: string
      required:
        - email
      type: object
    RevokedOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RevokedOutputBody.json
          format: uri
          readOnly: true
          type: string
        revoked:
          description: Number of sessions ended, including the current one.
          format: int64
          type: integer
      required:
        - revoked
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SessionBody.json
          format: uri
          readOnly: true
          type: string
        expires_at:
          description: Absolute deadline. Activity extends the idle window, never this.
          format: date-time
          type: string
        token:
          description: "Opaque session identifier. Send it as 'Authorization: Bearer <token>'."
          type: string
        user:
          $ref: "#/components/schemas/Body"
          description: The signed-in account.
      required:
        - token
        - expires_at
        - user
      type: object
    StructuredInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StructuredInputBody.json
          format: uri
          readOnly: true
          type: string
        json_schema:
          additionalProperties: {}
          description: JSON Schema the answer must follow.
          type: object
        prompt:
          description: The request itself.
          maxLength: 8192
          minLength: 1
          type: string
        system:
          description: Instructions that frame the request.
          maxLength: 4096
          type: string
      required:
        - prompt
        - json_schema
      type: object
    StructuredOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StructuredOutputBody.json
          format: uri
          readOnly: true
          type: string
        json:
          description: "The answer: a JSON document that follows the schema."
          type: string
        model:
          description: The model that answered.
          type: string
        quota:
          $ref: "#/components/schemas/QuotaBody"
          description: The account's allowance after this request.
      required:
        - json
        - model
        - quota
      type: object
  securitySchemes:
    deviceToken:
      description: Long-lived token issued to a self-hosted node during pairing.
      in: header
      name: X-Mediary-Device-Token
      type: apiKey
    sessionToken:
      description: Server-side session. The value is an opaque identifier with no claims inside it; every fact about the session lives in Redis, which is what makes revocation immediate. Sent as a header by native clients — there is no cookie transport, and therefore no CSRF surface.
      scheme: bearer
      type: http
info:
  description: "Public API of the Mediary cloud: accounts, paired devices, backup snapshots and AI requests on the deployment's own key. Consumed by the desktop client and by paired self-hosted nodes. The cloud holds no media metadata, never reads a snapshot's contents, and does not store what is sent to the AI."
  title: Mediary Cloud API
  version: 0.0.0-dev
openapi: 3.1.0
paths:
  /v1/account/deletion:
    post:
      description: "Mails the signed-in account a code that confirms deleting it. The session alone is not enough: one left open, or stolen, must not be able to erase everything its owner stored. A code rather than the password, so an account that signed up through a provider can be deleted too."
      operationId: requestAccountDeletion
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Ask to delete the account
      tags:
        - auth
  /v1/account/deletion/confirm:
    post:
      description: "Spends the code and deletes the account for good, with everything it owns: every session ends, every paired device is unpaired, every backup is erased. There is no undo."
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Delete the account with the mailed code
      tags:
        - auth
  /v1/account/devices:
    get:
      description: Lists the account's live devices. Tokens are never part of the answer.
      operationId: listDevices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Paired devices
      tags:
        - devices
  /v1/account/devices/pairing-codes:
    post:
      description: Issues a short one-time code the desktop hands to its node. The node trades it for a device token at /v1/devices/exchange. The code is single-use and short-lived; asking for another does not cancel the first.
      operationId: createPairingCode
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCodeOutputBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Start pairing a node
      tags:
        - devices
  /v1/account/devices/{id}:
    delete:
      description: Ends a device's token at once. Its backups stay; the node has to be paired again to upload more.
      operationId: revokeDevice
      parameters:
        - description: Device to revoke.
          in: path
          name: id
          required: true
          schema:
            description: Device to revoke.
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Revoke a device
      tags:
        - devices
  /v1/account/email/verification:
    post:
      description: "Mails a fresh 6-digit code to the signed-in account's own address. Takes no email parameter on purpose: the session already says who is asking, so the endpoint cannot be used to probe which addresses are registered."
      operationId: sendEmailVerification
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Send a confirmation code
      tags:
        - auth
  /v1/account/email/verification/confirm:
    post:
      description: "Spends a code and marks the address confirmed. Idempotent: confirming an already-confirmed address returns the account unchanged rather than an error."
      operationId: confirmEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Body"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Confirm the email address
      tags:
        - auth
  /v1/account/me:
    get:
      description: Returns the signed-in account. Read from the database rather than from the session, so a change of role or name is visible immediately.
      operationId: getCurrentAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Body"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Current account
      tags:
        - users
  /v1/account/oauth/providers:
    get:
      description: Lists providers this deployment has real credentials for.
      operationId: listOAuthProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProvidersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Available OAuth providers
      tags:
        - auth
  /v1/account/oauth/{provider}/callback:
    post:
      description: Exchanges a caught redirect for a session, replaying the PKCE verifier held against the state. Creates the account on first sign-in; refuses to link a provider to an email that already has an account under a different method.
      operationId: completeOAuth
      parameters:
        - description: Must match the provider OAuthStart was called with.
          in: path
          name: provider
          required: true
          schema:
            description: Must match the provider OAuthStart was called with.
            type: string
        - description: Recorded with the session so a user can recognise it later.
          in: header
          name: User-Agent
          schema:
            description: Recorded with the session so a user can recognise it later.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Complete OAuth sign-in
      tags:
        - auth
  /v1/account/oauth/{provider}/start:
    post:
      description: Returns the provider's consent URL, bound to a PKCE challenge whose verifier stays here. There is no cloud-hosted callback page — the client opens the URL in the system browser and catches the redirect on its own loopback listener.
      operationId: startOAuth
      parameters:
        - description: OAuth provider identifier, e.g. "google".
          in: path
          name: provider
          required: true
          schema:
            description: OAuth provider identifier, e.g. "google".
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Start OAuth sign-in
      tags:
        - auth
  /v1/account/password:
    put:
      description: "Replaces the password of the signed-in account and ends every session, this one included. The current password is required as well as the session: an unattended open session should not be enough to lock its owner out."
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Change the password
      tags:
        - auth
  /v1/account/password/reset:
    post:
      description: Mails a reset code if the address belongs to an account that has a password. The response is identical either way — an endpoint that answered honestly would let anyone test an address list against the user base.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOutputBody"
          description: Accepted
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Request a password reset
      tags:
        - auth
  /v1/account/password/reset/confirm:
    post:
      description: Exchanges a mailed code for a new password and ends every session the account holds, this one included — a reset is the answer to a compromise, and leaving the intruder signed in would defeat it.
      operationId: completePasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Set a new password with a reset code
      tags:
        - auth
  /v1/account/register:
    post:
      description: "Registers an account and mails a confirmation code. The returned token is the session identifier; it is shown once and cannot be recovered. Until the code is spent the session is restricted: it reaches only this account's own profile, the confirmation endpoints and sign-out, and every other operation answers 403."
      operationId: registerAccount
      parameters:
        - description: Recorded with the session so a user can recognise it later.
          in: header
          name: User-Agent
          schema:
            description: Recorded with the session so a user can recognise it later.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: Created
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create an account
      tags:
        - auth
  /v1/account/sessions:
    delete:
      description: Ends every session the account holds, including this one. Intended for a lost or stolen device.
      operationId: deleteAllSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Sign out everywhere
      tags:
        - auth
    post:
      description: "Exchanges credentials for a session identifier. Failures are charged twice: to the account, which bounds guessing against one password, and to the calling address, which bounds the same guess sprayed across many accounts."
      operationId: createSession
      parameters:
        - description: Recorded with the session so a user can recognise it later.
          in: header
          name: User-Agent
          schema:
            description: Recorded with the session so a user can recognise it later.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Sign in
      tags:
        - auth
  /v1/account/sessions/current:
    delete:
      description: "Ends the session used to make this call. Revocation is immediate: the identifier is deleted, not denylisted."
      operationId: deleteCurrentSession
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Sign out
      tags:
        - auth
  /v1/ai/quota:
    get:
      description: How many AI requests the account has left today. Reading it spends nothing.
      operationId: getAIQuota
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
        - deviceToken: []
      summary: Read the daily AI allowance
      tags:
        - ai
  /v1/ai/structured:
    post:
      description: Answers with one JSON document that follows the given schema, on the deployment's own key. Each account has a daily allowance; a request that fails is not counted against it. Nothing sent here is stored.
      operationId: structuredCompletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructuredInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
        - deviceToken: []
      summary: Ask the AI for a structured answer
      tags:
        - ai
  /v1/backups:
    get:
      description: The account's snapshots, newest first, from every device.
      operationId: listBackups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupListOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
        - deviceToken: []
      summary: List snapshots
      tags:
        - backups
    post:
      description: Stores the body as an opaque blob. If it has the same hash as this device's newest snapshot, nothing is written and that snapshot is returned with 200, so a node may upload on a schedule at no cost. Otherwise one upload per device per interval; the account keeps its newest snapshots and the newest of every live device.
      operationId: uploadBackup
      parameters:
        - description: mediary-node/<version>. Checked against the deployment's minimum client version.
          in: header
          name: User-Agent
          schema:
            description: mediary-node/<version>. Checked against the deployment's minimum client version.
            type: string
        - description: Lowercase hex SHA-256 of the body. A body that does not match is refused.
          in: header
          name: X-Backup-Sha256
          required: true
          schema:
            description: Lowercase hex SHA-256 of the body. A body that does not match is refused.
            pattern: ^[0-9a-f]{64}$
            type: string
        - description: The node's snapshot format version.
          in: header
          name: X-Backup-Format-Version
          required: true
          schema:
            description: The node's snapshot format version.
            format: int32
            minimum: 1
            type: integer
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupBody"
          description: "Unchanged: the device's newest snapshot already has this hash. Nothing was written."
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "426":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Upgrade Required
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - deviceToken: []
      summary: Upload a snapshot
      tags:
        - backups
  /v1/backups/{id}:
    delete:
      description: "Signed-in users only: a device may add history but not erase it."
      operationId: deleteBackup
      parameters:
        - description: Snapshot identifier.
          in: path
          name: id
          required: true
          schema:
            description: Snapshot identifier.
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - sessionToken: []
      summary: Delete a snapshot
      tags:
        - backups
    get:
      description: Streams the body exactly as it was uploaded, with its hash and format version in the X-Backup-Sha256 and X-Backup-Format-Version headers.
      operationId: downloadBackup
      parameters:
        - description: Snapshot identifier.
          in: path
          name: id
          required: true
          schema:
            description: Snapshot identifier.
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The snapshot body.
          headers:
            X-Backup-Format-Version:
              description: The node's snapshot format version.
              schema:
                type: integer
            X-Backup-Sha256:
              description: Hex SHA-256 of the body.
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      security:
        - sessionToken: []
        - deviceToken: []
      summary: Download a snapshot
      tags:
        - backups
  /v1/devices/exchange:
    post:
      description: Trades a pairing code for a device token. Unauthenticated by necessity — the node has no credential yet — so the code is the whole proof, and attempts are limited per address.
      operationId: exchangePairingCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeOutputBody"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Pair a node
      tags:
        - devices
  /v1/health:
    get:
      description: Reports liveness and the build the process is running.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Service health
      tags:
        - health
tags:
  - description: Liveness and build information.
    name: health
  - description: Registration, sign-in, sessions, OAuth and password recovery.
    name: auth
  - description: The signed-in account's profile.
    name: users
  - description: Self-hosted nodes paired with the account.
    name: devices
  - description: "Backup snapshots: opaque blobs a node uploads and restores."
    name: backups
  - description: Structured AI answers on the deployment's key, within a daily allowance.
    name: ai
